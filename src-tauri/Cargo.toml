[package]
name = "mandi-bolli-app"
version = "1.0.0"
description = "Mandi Bolli Commission Billing and Khata App - Ultra Lightweight Native Desktop App"
authors = ["Mandi Bolli App"]
edition = "2021"

[lib]
name = "mandi_bolli_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

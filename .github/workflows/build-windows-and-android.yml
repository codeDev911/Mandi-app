name: Build Windows Desktop App & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build Web App
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mandi-Bolli-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build Desktop Binaries
        run: |
          npx vite build
          npx @neutralinojs/neu update
          npx @neutralinojs/neu build --release

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: Mandi-Bolli-Windows-Desktop-x64
          path: |
            dist-neutralino/mandi-bolli-app/mandi-bolli-app-win_x64.exe
            dist-neutralino/mandi-bolli-app/resources.neu
            dist-neutralino/mandi-bolli-app-release.zip
          if-no-files-found: warn
